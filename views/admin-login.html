<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Admin Login
    </title>

    <link rel="stylesheet" href="/admin.css">

</head>

<body>

    <div class="main">

        <div class="card" style="
        max-width:450px;
        margin:auto;
        margin-top:120px;
        ">

            <h1 style="
            margin-bottom:30px;
            text-align:center;
            ">
                Admin Login
            </h1>

            <form method="POST" action="/admin-login">

                <input type="text" name="username" placeholder="Admin ID" required style="
                width:100%;
                padding:15px;
                margin-bottom:20px;
                border:none;
                border-radius:10px;
                ">

                <input type="password" name="password" placeholder="Password" required style="
                width:100%;
                padding:15px;
                margin-bottom:20px;
                border:none;
                border-radius:10px;
                ">

                <button style="
                width:100%;
                padding:15px;
                border:none;
                border-radius:10px;
                background:#2563eb;
                color:white;
                font-size:16px;
                cursor:pointer;
                ">

                    Login

                </button>

            </form>

        </div>

    </div>

</body>

</html>

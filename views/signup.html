<!DOCTYPE html>
<html>

<head>
    <title>Sign Up</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .auth-box {
            width: 400px;
            margin: 120px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            color: white;
            text-align: center;
        }

        input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border: none;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #f59e0b;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="auth-box">

        <h2>Sign Up</h2>

        <form method="POST" action="/signup">
            
            <input type="text" name="fullname" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Create Account</button>

        </form>

    </div>

</body>

</html>

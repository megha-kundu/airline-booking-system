<!DOCTYPE html>
<html>

<head>
    <title>Sign Up</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .signup-toast {
            align-items: center;
            background: #fff;
            border: 1px solid #f0c4c4;
            border-left: 5px solid #d9534f;
            border-radius: 8px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, .2);
            color: #7a2421;
            display: none;
            gap: 12px;
            margin: 0 auto 18px;
            padding: 14px 16px;
            text-align: left;
        }

        .signup-toast.signup-error {
            display: flex;
        }

        .signup-toast strong {
            color: #b52b27;
            display: block;
        }

        .auth-box {
            width: 400px;
            margin: 120px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            color: white;
            text-align: center;
        }

        input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border: none;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #f59e0b;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 48px;
        }

        .password-toggle {
            background: transparent !important;
            color: #f59e0b;
            cursor: pointer;
            padding: 5px;
            position: absolute;
            right: 8px;
            top: 13px;
            width: auto !important;
        }
    </style>
</head>

<body>

    <div class="auth-box">

        <div class="signup-toast {{signupMessageClass}}"><span>!</span>
            <div><strong>Account notice</strong>{{signupMessage}}</div>
        </div>

        <h2>Sign Up</h2>

        <form method="POST" action="/signup">

            <input type="text" name="fullname" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email" required>

            <div class="password-wrap"><input id="signupPassword" type="password" name="password" placeholder="Password"
                    required><button class="password-toggle" type="button" aria-label="Show password"
                    onclick="togglePassword('signupPassword', this)">◉</button></div>

            <button type="submit">Create Account</button>

        </form>

    </div>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            input.type = input.type === "password" ? "text" : "password";
            button.textContent = input.type === "password" ? "◉" : "○";
            button.setAttribute("aria-label", input.type === "password" ? "Show password" : "Hide password");
        }
    </script>

</body>

</html>

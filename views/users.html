<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Users
    </title>

    <link rel="stylesheet" href="/admin.css">

</head>

<body>

    <div class="sidebar">

        <h2>
            SKYLINE ✈
        </h2>

        <a href="/admin">
            Dashboard
        </a>

        <a href="/admin-bookings">
            Bookings
        </a>

        <a href="/dashboard">
            Flights
        </a>

        <a href="/admin-users">
            Users
        </a>

        <a href="/">
            Logout
        </a>

    </div>

    <div class="main">

        <h1>
            Registered Users
        </h1>

        <div class="table-box">

            <table>

                <tr>

                    <th>
                        Name
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

                {{userRows}}

            </table>

        </div>

    </div>

    <div id="deleteModal" class="modal">

        <div class="modal-content">

            <h2>Delete User</h2>

            <p>Are you sure you want to delete this user?</p>

            <button id="cancelBtn">
                Cancel
            </button>

            <a id="confirmDelete" href="#">
                Delete
            </a>

        </div>

    </div>

    <script>

        const modal =
            document.getElementById("deleteModal");

        const confirmDelete =
            document.getElementById("confirmDelete");

        function openDeleteModal(url) {

            modal.style.display = "flex";

            confirmDelete.href = url;
        }

        document.getElementById("cancelBtn")
            .onclick = function () {

                modal.style.display = "none";
            };

    </script>
</body>

</html>

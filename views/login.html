<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .auth-box {
            width: 400px;
            margin: 120px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            color: white;
            text-align: center;
        }

        .auth-box h2 {
            margin-bottom: 20px;
        }

        .auth-box input {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border: none;
            border-radius: 10px;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #3b82f6;
            color: white;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        .auth-box a {
            color: #f59e0b;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="auth-box">

        <h2>Login</h2>

        <form method="POST" action="/login">
            <input type="text" name="fullname" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>

        </form>

        <a href="/signup">Create new account</a>

    </div>

</body>

</html>
